# Applied by lab.sh on top of docker-compose.yml (COMPOSE_FILE). Not used by `lab.sh foss-check`, whose copy has no enterprise/.
# Community Edition: config/application.rb:49 puts enterprise/app/views FIRST in the view path even with
# DISABLE_ENTERPRISE=true, and e.g. the Enterprise confirmation mail calls Account#saml_enabled? (undefined in CE).
# An empty tmpfs over that directory (container only, host tree untouched) restores the OSS views.
# Production must instead ship an artifact built WITHOUT enterprise/ (docs/terranet/03-privacy-egress-audit.md section 7).
services:
  rails:
    tmpfs: [/app/enterprise/app/views]
  sidekiq:
    tmpfs: [/app/enterprise/app/views]
  vite:
    tmpfs: [/app/enterprise/app/views]
  audit:
    tmpfs: [/app/enterprise/app/views]
