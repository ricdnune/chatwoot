# DNS sink for the Terranet lab: every name that is not a lab service resolves to a dead-end
# address, and every query is logged. This is a metadata-only egress audit (FQDN + client).
no-resolv
no-hosts
log-queries
log-async=20
# Lab services keep resolving through Docker's embedded DNS (127.0.0.11) for the compose network.
server=/postgres/127.0.0.11
server=/redis/127.0.0.11
server=/mailpit/127.0.0.11
server=/rails/127.0.0.11
server=/vite/127.0.0.11
server=/sidekiq/127.0.0.11
# Everything else -> blackhole (TEST-NET-1, RFC 5737; unroutable inside the internal network).
address=/#/192.0.2.1
